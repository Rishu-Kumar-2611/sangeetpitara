# Adopts the existing Singapore resources; secrets stay inside Render.
# This Blueprint becomes the source of truth for the settings listed here.
services:
  - type: web
    name: sangeet-pitaraa
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.runtime
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROOMSOUND_TEST_MODE
        value: "0"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CANONICAL_PUBLIC_HOST
        value: sangeet-pitaraa.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: MEDIA_RELAY_ENABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://sangeet-pitaraa.onrender.com
      - key: METRICS_BEARER_TOKEN
        generateValue: true
# Existing credentials, database contents, and omitted settings are preserved.
databases:
  - name: Sangeet Pitara
    plan: free
    region: singapore
    databaseName: sangeet_pitara
    user: sangeet_pitara_user
    postgresMajorVersion: "18"

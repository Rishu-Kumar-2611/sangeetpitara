services:
  - type: web
    name: sangeet-pitaraa
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.runtime
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: CANONICAL_PUBLIC_HOST
        value: sangeet-pitaraa.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TURN_ENABLED
        value: "0"
      - key: MEDIA_RELAY_ENABLED
        value: "1"
      - key: REWARDED_AD_PROVIDER
        value: demo-local
      - key: REWARDED_AD_MODE
        value: offline
      - key: REWARDED_AD_DURATION_SECONDS
        value: "30"
      - key: REWARDED_ACCESS_DURATION_HOURS
        value: "6"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADSENSE_ENABLED
        sync: false
      - key: ADSENSE_CLIENT
        sync: false
      - key: ADSENSE_LANDING_SLOT
        sync: false
      - key: ADSENSE_ROOM_SLOT
        sync: false
      - key: METRICS_BEARER_TOKEN
        sync: false

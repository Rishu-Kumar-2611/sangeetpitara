name: Android checks

# Only Android sources and this workflow can change the result, so web-only
# changes skip the Gradle build.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run JVM unit tests, lint, and build a test APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      # Debug-signed build for trying a pull request on a phone before merge.
      # Published releases come only from release.yml.
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SangeetPitara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # Prove the release build (signing config, lint-vital, dependency locks)
      # works before anyone pushes a tag. The throwaway key never leaves the job.
      - name: Build release APK with a throwaway key
        run: |
          keystore="$RUNNER_TEMP/throwaway.keystore"
          keytool -genkeypair -noprompt -keystore "$keystore" -storepass throwaway \
            -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=SangeetPitara CI"
          ROOMSOUND_KEYSTORE="$keystore" ROOMSOUND_KEYSTORE_PASSWORD=throwaway \
            ROOMSOUND_KEY_ALIAS=throwaway ROOMSOUND_KEY_PASSWORD=throwaway \
            ROOMSOUND_VERSION_NAME=0.0.0 ROOMSOUND_VERSION_CODE=1 \
            ./gradlew :app:assembleRelease --no-daemon --console=plain
          rm -f "$keystore"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

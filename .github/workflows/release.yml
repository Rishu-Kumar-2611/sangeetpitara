name: Android release

# Push a tag like v1.1.2 to build, sign and publish the Android app:
#   git tag v1.1.2 && git push origin v1.1.2
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Derive version from tag
        id: version
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag $TAG must look like v1.2.3 (minor and patch below 100)."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          # 1.0.1 shipped as versionCode 3; every tagged release must be higher
          # so Android installs it as an update.
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          if (( code <= 3 )); then
            echo "::error::Tag $TAG maps to versionCode $code, which is not above the shipped 3."
            exit 1
          fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js and run web release checks
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and test web release
        working-directory: .
        run: npm ci && npm test && npm run check

      - name: Verify repository release identity
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="$(sed -n 's/^VERSION_NAME=//p' release.properties)"
          if [ "$TAG" != "v$expected" ]; then
            echo "::error::Tag $TAG does not match release.properties version $expected."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; see the comment at the top of release.yml."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test and build signed release APK
        env:
          ROOMSOUND_VERSION_NAME: ${{ steps.version.outputs.name }}
          ROOMSOUND_VERSION_CODE: ${{ steps.version.outputs.code }}
          ROOMSOUND_RELEASES_REPOSITORY: ${{ github.repository }}
          ROOMSOUND_KEYSTORE: ${{ runner.temp }}/release.keystore
          ROOMSOUND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ROOMSOUND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ROOMSOUND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon --console=plain

      - name: Verify signature and stage assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p "$RUNNER_TEMP/release"
          # Fixed name: /releases/latest/download/SangeetPitara.apk always
          # points at the newest release (the website and in-app update use it).
          cp "$apk" "$RUNNER_TEMP/release/SangeetPitara.apk"
          cp "$apk" "$RUNNER_TEMP/release/SangeetPitara-$TAG.apk"

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "SangeetPitara $NAME" \
            --generate-notes \
            "$RUNNER_TEMP/release/SangeetPitara.apk" \
            "$RUNNER_TEMP/release/SangeetPitara-$TAG.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

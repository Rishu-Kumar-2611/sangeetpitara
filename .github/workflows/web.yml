name: Web checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '**/*.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run syntax and release checks
        run: npm run check
      - name: Run isolated release and room smoke checks
        run: node checks/release-local.mjs
